<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Analytics Hub | Certificate Portal</title>
<style>
:root {
  --navy:#06172c;
  --panel:#0b2541;
  --gold:#f4bd4b;
  --lightgold:#ffe5a0;
  --white:#f8fbff;
  --muted:#c5d5e8;
  --border:#345474;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(ellipse at 80% 10%,#1a3c59,transparent 42%),var(--navy);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:18px;padding:18px 5%;
  background:#041326;border-bottom:2px solid #b8862e;
}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  display:grid;place-items:center;width:64px;height:64px;
  border:3px solid var(--gold);border-radius:50%;
  color:var(--gold);font-weight:900;font-size:21px;
  box-shadow:0 0 18px #f4bd4b22;
}
.brand h1{font-size:clamp(21px,3vw,29px);margin:0}
.brand h1 span{color:var(--gold)}
.tagline{color:var(--muted);letter-spacing:3px;font-size:11px;margin:0}
nav{display:flex;flex-wrap:wrap;gap:7px}
nav a{
  color:white;text-decoration:none;padding:9px 12px;
  border-radius:20px;font-size:13px
}
nav a:hover{background:var(--gold);color:var(--navy)}
main{max-width:1250px;margin:auto;padding:28px 5%}
.hero{
  display:grid;grid-template-columns:1.15fr .85fr;
  gap:25px;align-items:center;margin-bottom:25px
}
.hero h2{
  font-family:Georgia,serif;font-size:clamp(31px,4.6vw,52px);
  line-height:1.2;margin:0
}
.hero h2 span{display:block;color:var(--gold);font-size:1.2em}
.hero p{color:var(--muted)}
.hero-art{
  min-height:240px;padding:25px;text-align:center;
  border:1px solid #c69b42;border-radius:16px;
  background:radial-gradient(circle,#173c5c,#06172c 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.hero-art .logo{width:115px;height:115px;font-size:35px;margin-bottom:12px}
.hero-art strong{letter-spacing:2px}
.hero-art em{color:var(--lightgold);font-family:Georgia,serif;font-size:20px}
.notice{
  background:#102d49;border-left:4px solid var(--gold);
  padding:14px 17px;border-radius:7px;margin:18px 0;color:#e0eaf6;
  overflow-wrap:anywhere
}
.notice strong{color:var(--gold)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}
.panel{
  background:linear-gradient(145deg,#0b2541,#06172b);
  border:1px solid var(--border);border-radius:15px;
  padding:24px;box-shadow:0 12px 32px #0002
}
.panel h2{margin:0 0 8px;font-size:24px}
.subheading{color:var(--muted);font-size:14px}
.courses{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:11px;margin:20px 0
}
.course{
  min-height:105px;text-align:left;padding:13px 10px;
  color:white;background:#0a2946;border:1px solid #345474;
  border-radius:10px;cursor:pointer;font-size:14px;
  overflow-wrap:anywhere;transition:.2s
}
.course .icon{display:block;font-size:26px;margin-bottom:5px}
.course:hover,.course.selected{
  border-color:var(--gold);background:#153c5c;
  box-shadow:0 0 14px #f4bd4b25
}
button:focus-visible,a:focus-visible,input:focus-visible{
  outline:3px solid white;outline-offset:3px
}
.primary{
  display:block;width:100%;padding:15px;border:0;border-radius:9px;
  color:#081a2e;background:linear-gradient(110deg,#ffe5a0,#f4bd4b);
  font-size:17px;font-weight:bold;cursor:pointer
}
.primary:hover{filter:brightness(1.08)}
.steps{list-style:none;margin:20px 0 0;padding:0}
.steps li{position:relative;padding:0 0 22px 45px;color:var(--muted)}
.steps li:before{
  content:attr(data-n);position:absolute;left:0;top:0;
  width:30px;height:30px;border:2px solid var(--gold);
  border-radius:50%;display:grid;place-items:center;color:var(--gold)
}
.steps strong{display:block;color:white}
.hidden{display:none!important}
#assessment,#application{margin-top:24px}
.question{
  padding:15px;margin:13px 0;border:1px solid var(--border);
  border-radius:9px;min-width:0
}
.question legend{font-weight:bold;padding:0 6px}
.option{display:flex;gap:10px;margin:10px 0;color:#dce7f5;cursor:pointer}
.option input{accent-color:var(--gold);margin-top:5px}
.progress{height:8px;background:#1d3953;border-radius:8px;overflow:hidden;margin:12px 0}
.progress div{height:100%;width:0;background:var(--gold)}
.result{margin-top:16px;padding:17px;background:#102d49;border:1px solid var(--border);border-radius:9px}
.result.good{border-color:#48cf94}
.result.bad{border-color:#ff8888}
label.form-label{display:block;font-weight:bold;margin-top:13px}
input[type=text],input[type=email],input[type=tel]{
  width:100%;padding:12px;margin:6px 0;
  background:#04182d;border:1px solid #456582;
  color:white;border-radius:7px;font-size:15px
}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}
.benefit{text-align:center;padding:14px 8px;border-right:1px solid var(--border)}
.benefit:last-child{border:0}
.benefit span{display:block;font-size:27px;color:var(--gold)}
.benefit small{color:var(--muted)}
footer{
  padding:25px 5%;background:#031122;border-top:1px solid #a87d32;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:15px;
  color:var(--muted);font-size:13px
}
footer a{color:var(--lightgold)}
