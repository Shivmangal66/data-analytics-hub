/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* =========================================================
   SHOW LESSON
========================================================= */

function showLesson(index){

    document
        .querySelectorAll(".lesson")
        .forEach(x => {

            x.classList.remove("active");

        });


    document
        .querySelectorAll(".sidebar a")
        .forEach(x => {

            x.classList.remove("active");

        });


    let lesson =
        document.getElementById("lesson"+index);

    if(lesson){

        lesson.classList.add("active");

    }


    let links =
        document.querySelectorAll(".sidebar a");

    let topicLinks = [];

    links.forEach(link => {

        if(link.dataset.title){
            topicLinks.push(link);
        }

    });


    if(topicLinks[index]){

        topicLinks[index]
            .classList.add("active");

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousLesson(index){

    if(index > 0){

        showLesson(index - 1);

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextLesson(index){

    if(index < allLessons.length - 1){

        showLesson(index + 1);

    }

}


/* =========================================================
   SEARCH
========================================================= */

function searchTopics(){

    let value =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    document
        .querySelectorAll(".sidebar a")
        .forEach(link => {

            if(!link.dataset.title)
                return;

            if(
                link.dataset.title
                .includes(value)
            ){

                link.style.display = "block";

            }else{

                link.style.display = "none";

            }

        });

}


/* =========================================================
   PYODIDE
   Load only the packages required by the current lesson.
========================================================= */
let pyodide = null;

async function getPyodide() {

    if (pyodide === null) {

        pyodide = await loadPyodide({
            indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/"
        });

    }

    return pyodide;
}

async function loadPackagesForCode(python, code) {

    // Official Pyodide method: detect imports and load the
    // matching built-in packages automatically.
    await python.loadPackagesFromImports(code);

    // Seaborn is not part of the built-in Pyodide 0.27.2 package
    // list, so install it only for the Seaborn lesson.
    if (/^\s*(?:from\s+seaborn|import\s+seaborn)/m.test(code)) {

        await python.runPythonAsync(`
import micropip
await micropip.install("seaborn")
`);

    }
}

/* =========================================================
   RUN PYTHON
========================================================= */

async function runPython(index) {

    const code =
        document.getElementById("code" + index).value;

    const output =
        document.getElementById("output" + index);

    output.textContent = "Loading Python...";

    try {

        const python = await getPyodide();

        // Load only packages required by this lesson.
        await loadPackagesForCode(python, code);

        // Reset stdout before every execution.
        python.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);

        await python.runPythonAsync(code);

        const result =
            python.runPython(
                "sys.stdout.getvalue()"
            );

        output.textContent =
            result || "Code executed successfully.";

    } catch (error) {

        output.textContent =
            "Python Error:\n\n" +
            (error && error.message ? error.message : error);

    }
}
