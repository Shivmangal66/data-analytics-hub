        <div class="box">
            <b>Key Points</b>
            <ul>
                <li>Understand the concept.</li>
                <li>Run the example yourself.</li>
                <li>Modify the code and experiment.</li>
                <li>Practice without copying.</li>
            </ul>
        </div>

        <div class="nav">
            <button onclick="previousLesson(${i})">
                ❮ Previous
            </button>

            <button onclick="nextLesson(${i})">
                Next ❯
            </button>
        </div>
    `;

    lessons.appendChild(section);
});

function escapeHTML(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function showLesson(index){

    document.querySelectorAll(".lesson")
        .forEach(x=>x.classList.remove("active"));

    document.querySelectorAll(".side a")
        .forEach(x=>x.classList.remove("active"));

    document.getElementById("lesson"+index)
        .classList.add("active");

    document.querySelectorAll(".side a")[index]
        .classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function previousLesson(i){
    if(i>0) showLesson(i-1);
}

function nextLesson(i){
    if(i<topics.length-1) showLesson(i+1);
}

function searchTopics(){

    let value=document
        .getElementById("search")
        .value
        .toLowerCase();

    document.querySelectorAll(".side a")
        .forEach(a=>{

            a.style.display =
                a.dataset.title.includes(value)
                ? "block"
                : "none";

        });
}

/* Python Runtime */

let pyodideReady = false;
let pyodide;

async function loadPython(){

    if(!pyodideReady){

        pyodide =
            await loadPyodide();

        pyodideReady=true;
    }
}

async function runPython(i){

    let output=
        document.getElementById("output"+i);

    let code=
        document.getElementById("code"+i).value;

    output.textContent="Running Python...";

    try{

        await loadPython();

        pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);

        await pyodide.runPythonAsync(code);

        let result=
            pyodide.runPython(
                "sys.stdout.getvalue()"
            );

        output.textContent=
            result || "Code executed successfully.";

    }catch(error){

        output.textContent=
            "Error:\\n"+error;

    }

}

showLesson(0);

</script>
