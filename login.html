<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Data Analytics Hub</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Login</h1>

    <input id="email" type="email" placeholder="Enter Email">

    <input id="password" type="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

</div>

<script>

const SUPABASE_URL = "https://kieigelxfjtuyueuoiow.supabase.co";

const SUPABASE_KEY = "sb_publishable_kal13mMuw9LHg8wBs1n9lg_1Lph7md_";

async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
    }

    try {

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.msg || data.message || "Invalid email or password.";
            return;
        }

        localStorage.setItem(
            "access_token",
            data.access_token
        );

        localStorage.setItem(
            "user_email",
            email
        );

        window.location.href = "dashboard.html";

    } catch (error) {

        message.textContent =
            "Something went wrong. Please try again.";

        console.error(error);
    }
}

</script>

</body>
</html>
