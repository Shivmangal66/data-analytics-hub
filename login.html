<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Data Analytics Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{

    min-height:100vh;

    background:
    radial-gradient(circle at top left,#2563eb55,transparent 35%),
    radial-gradient(circle at bottom right,#7c3aed55,transparent 35%),
    #070b18;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
}

.login-wrapper{

    width:100%;
    max-width:1000px;

    display:flex;

    background:#111827cc;

    border:1px solid #ffffff18;

    backdrop-filter:blur(20px);

    border-radius:25px;

    overflow:hidden;

    box-shadow:0 25px 80px #00000080;
}


/* LEFT SIDE */

.left{

    width:50%;

    padding:60px;

    background:
    linear-gradient(135deg,#2563eb,#4f46e5);

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.logo{

    font-size:28px;

    font-weight:bold;

    margin-bottom:25px;
}

.left h1{

    font-size:42px;

    margin-bottom:20px;
}

.left p{

    font-size:17px;

    line-height:1.7;

    color:#e0e7ff;
}

.features{

    margin-top:30px;

}

.feature{

    margin:15px 0;

    font-size:16px;
}


/* RIGHT SIDE */

.right{

    width:50%;

    padding:55px 45px;

    background:#0f172acc;

}

.right h2{

    font-size:32px;

    margin-bottom:10px;
}

.subtitle{

    color:#94a3b8;

    margin-bottom:30px;
}


.input-group{

    margin-bottom:18px;
}

.input-group label{

    display:block;

    margin-bottom:8px;

    color:#cbd5e1;

}

.input-group input{

    width:100%;

    padding:14px 15px;

    background:#020617;

    border:1px solid #334155;

    border-radius:10px;

    color:white;

    outline:none;

    font-size:15px;

    transition:0.3s;
}

.input-group input:focus{

    border-color:#3b82f6;

    box-shadow:0 0 0 3px #3b82f622;
}


.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:linear-gradient(90deg,#2563eb,#7c3aed);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    margin-top:5px;
}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 30px #2563eb55;
}


#message{

    text-align:center;

    margin-top:15px;

    font-size:14px;
}


.signup{

    text-align:center;

    margin-top:25px;

    color:#94a3b8;
}

.signup a{

    color:#60a5fa;

    text-decoration:none;

    font-weight:bold;
}

.signup a:hover{

    text-decoration:underline;
}


/* MOBILE */

@media(max-width:750px){

    .login-wrapper{

        margin:20px;

        flex-direction:column;
    }

    .left,
    .right{

        width:100%;
    }

    .left{

        padding:35px;

        text-align:center;
    }

    .left h1{

        font-size:32px;
    }

    .right{

        padding:35px 25px;
    }

}

</style>

</head>


<body>


<div class="login-wrapper">


<!-- LEFT -->

<div class="left">

<div class="logo">

📊 Data Analytics Hub

</div>

<h1>

Welcome Back 👋

</h1>

<p>

Continue your journey to become
a professional Data Analyst.

</p>


<div class="features">

<div class="feature">

📗 Excel & Data Analysis

</div>

<div class="feature">

🐍 Python for Data Analytics

</div>

<div class="feature">

🗄️ SQL & Databases

</div>

<div class="feature">

📊 Power BI Dashboards

</div>

</div>

</div>



<!-- RIGHT -->

<div class="right">

<h2>

Login

</h2>

<p class="subtitle">

Access your learning dashboard

</p>


<div class="input-group">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter your email"
>

</div>


<div class="input-group">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter your password"
>

</div>


<button
class="login-btn"
id="loginButton"
type="button"
>

🔐 Login to Dashboard

</button>


<p id="message"></p>


<div class="signup">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</div>


</div>

</div>



<script>


const SUPABASE_URL =
"https://kieigelxfjtuyueuoiow.supabase.co";


const SUPABASE_KEY =
"sb_publishable_kal13mMuw9LHg8wBs1n9lg_1Lph7md_";


document
.getElementById("loginButton")
.addEventListener("click", login);


async function login(){


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const message =
document
.getElementById("message");


if(!email || !password){

message.textContent =
"❌ Please enter email and password.";

message.style.color="#f87171";

return;

}


message.textContent =
"⏳ Logging in...";

message.style.color="#60a5fa";


try{


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY

},

body:JSON.stringify({

email:email,

password:password

})

});


const data =
await response.json();


if(!response.ok){

message.textContent =
"❌ " +
(
data.msg ||
data.message ||
"Invalid email or password."
);

message.style.color="#f87171";

return;

}


localStorage.setItem(

"access_token",

data.access_token

);


localStorage.setItem(

"user_email",

email

);


message.textContent =
"✅ Login successful!";

message.style.color="#4ade80";


setTimeout(()=>{

window.location.href=
"dashboard.html";

},700);


}

catch(error){

console.error(error);

message.textContent =
"❌ Connection error.";

message.style.color="#f87171";

}

}

</script>


</body>

</html>
