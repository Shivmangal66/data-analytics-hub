<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Data Analytics Hub</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #2563eb;
        }

        .card button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>

    <h2>📊 Data Analytics Hub</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>

<div class="container">

    <div class="welcome">

        <h1>👋 Welcome!</h1>

        <p id="userEmail"></p>

        <p>
            Start learning Data Analytics step by step.
        </p>

    </div>

    <div class="courses">

        <div class="card">
            <h3>📗 Excel</h3>
            <p>Learn Excel from beginner to advanced.</p>
            <button>Start Learning</button>
        </div>

        <div class="card">
            <h3>🐍 Python</h3>
            <p>Learn Python for Data Analytics.</p>
            <button>Start Learning</button>
        </div>

        <div class="card">
            <h3>🗄️ SQL</h3>
            <p>Learn SQL and databases.</p>
            <button>Start Learning</button>
        </div>

        <div class="card">
            <h3>📊 Power BI</h3>
            <p>Create professional dashboards.</p>
            <button>Start Learning</button>
        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("access_token");
const email = localStorage.getItem("user_email");

if (!token) {
    window.location.href = "login.html";
}

document.getElementById("userEmail").textContent =
    "Logged in as: " + email;


function logout() {

    localStorage.removeItem("access_token");
    localStorage.removeItem("user_email");

    window.location.href = "index.html";
}

</script>

</body>
</html>
