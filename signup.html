<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Data Analytics Hub</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #16a34a;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        button:hover {
            background: #15803d;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>📝 Create Account</h1>

    <input id="name" type="text" placeholder="Enter Full Name">

    <input id="email" type="email" placeholder="Enter Email">

    <input id="password" type="password" placeholder="Create Password">

    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button id="signupButton" type="button">
        Create Account
    </button>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://kieigelxfjtuyueuoiow.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_kal13mMuw9LHg8wBs1n9lg_1Lph7md_";


document.getElementById("signupButton").addEventListener("click", createAccount);


async function createAccount() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    message.textContent = "";


    if (!name || !email || !password || !confirmPassword) {

        message.textContent =
            "❌ Please fill all fields.";

        message.style.color = "red";

        return;
    }


    if (password !== confirmPassword) {

        message.textContent =
            "❌ Passwords do not match.";

        message.style.color = "red";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "❌ Password must be at least 6 characters.";

        message.style.color = "red";

        return;
    }


    message.textContent =
        "⏳ Creating account...";

    message.style.color = "blue";


    try {

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },

                body: JSON.stringify({
                    email: email,
                    password: password,
                    data: {
                        full_name: name
                    }
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            message.textContent =
                "❌ " +
                (data.msg ||
                 data.message ||
                 data.error_description ||
                 "Account creation failed.");

            message.style.color = "red";

            return;
        }


        message.textContent =
            "✅ Account created successfully!";

        message.style.color = "green";


        setTimeout(function() {

            window.location.href = "login.html";

        }, 2000);


    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Connection error. Please try again.";

        message.style.color = "red";
    }

}

</script>

</body>
</html>
