<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Data Analytics Hub</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #16a34a;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>📝 Create Account</h1>

    <input id="name" type="text" placeholder="Enter Full Name">

    <input id="email" type="email" placeholder="Enter Email">

    <input id="password" type="password" placeholder="Create Password">

    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button onclick="createAccount()">Create Account</button>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script type="module">

const SUPABASE_URL = "https://kieigelxfjtuyueuoiow.supabase.co";

const SUPABASE_KEY = "sb_publishable_kal13mMuw9LHg8wBs1n9lg_1Lph7md_";

async function createAccount() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (!name || !email || !password || !confirmPassword) {
        message.textContent = "Please fill all fields.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    try {

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },

                body: JSON.stringify({
                    email: email,
                    password: password,
                    data: {
                        full_name: name
                    }
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.msg || data.message || "Account creation failed.";
            return;
        }

        message.textContent =
            "✅ Account created! Check your email for verification.";

    } catch (error) {

        message.textContent =
            "Something went wrong. Please try again.";

        console.error(error);
    }
}

</script>

</body>
</html>
